name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student_resource/code/business_entity_resolution
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: student_resource/code/business_entity_resolution/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
